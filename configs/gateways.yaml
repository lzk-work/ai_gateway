default_gateway: buzz

gateways:
  buzz:
    type: buzz
    base_url: https://buzzai.cc
    api_key_env: BUZZ_API_KEY
    auth_header: Authorization
    timeout_seconds: 300
    max_retries: 3
  mxapi:
    type: mxapi
    base_url: https://open.mxapi.org
    api_key_env: MXAPI_API_KEY
    auth_header: Authorization
    timeout_seconds: 600
    max_retries: 3
