[project]
name = "ai-gateway"
version = "0.1.0"
description = "Multi-gateway AI API calling framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]
yaml = ["PyYAML>=6.0"]
oss = ["oss2>=2.18.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
